<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Language Practice</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body{
  background:#fff8fc;
  color:#443b46
}

button,select{
  font:inherit;
  -webkit-tap-highlight-color:transparent
}

button{
  appearance:none
}

.app{
  min-height:100vh;
  padding:18px 16px 40px;
  position:relative;
  overflow:hidden
}

.content{
  position:relative;
  z-index:2;
  max-width:680px;
  margin:auto
}

.decoration{
  position:fixed;
  pointer-events:none;
  border-radius:50%;
  z-index:0
}

.decoration.one{
  width:280px;
  height:280px;
  right:-125px;
  top:-125px;
  background:#f7d9e7;
  opacity:.45
}

.decoration.two{
  width:260px;
  height:260px;
  left:-150px;
  bottom:-130px;
  background:#e1e7fa;
  opacity:.42
}

.flag{
  position:fixed;
  z-index:0;
  pointer-events:none;
  opacity:.055;
  filter:blur(.2px);
  user-select:none
}

.flag.uk{
  font-size:180px;
  right:-22px;
  top:90px;
  transform:rotate(10deg)
}

.flag.kr{
  font-size:170px;
  left:-28px;
  bottom:80px;
  transform:rotate(-10deg)
}

.topbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:12px
}

.menu-button,.back-button{
  border:0;
  background:rgba(255,255,255,.88);
  color:#5b515b;
  box-shadow:0 8px 28px rgba(78,56,72,.10);
  cursor:pointer
}

.menu-button{
  width:48px;
  height:48px;
  border-radius:17px;
  font-size:24px
}

.hero{
  text-align:center;
  padding:18px 8px 28px
}

.flower{
  font-size:40px;
  margin-bottom:8px;
  filter:drop-shadow(0 7px 12px rgba(213,142,177,.18))
}

.hero h1{
  margin:0;
  font-size:clamp(34px,9vw,50px);
  letter-spacing:-1.4px;
  color:#3f3741
}

.hero p{
  margin:10px auto 0;
  max-width:430px;
  line-height:1.6;
  font-size:15px;
  color:#887b86
}

.section-title{
  margin:8px 4px 12px;
  font-size:16px;
  font-weight:700;
  color:#695d67
}

.modes{
  display:grid;
  gap:14px
}

.mode-card{
  width:100%;
  border:1px solid rgba(240,219,230,.9);
  border-radius:25px;
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(12px);
  padding:20px;
  text-align:left;
  box-shadow:0 12px 35px rgba(77,53,70,.08);
  cursor:pointer;
  transition:transform .18s,box-shadow .18s
}

.mode-card:active{
  transform:scale(.985)
}

.mode-icon{
  font-size:29px;
  margin-bottom:10px
}

.mode-card h2{
  margin:0 0 7px;
  font-size:20px;
  color:#443a44
}

.mode-card p{
  margin:0;
  line-height:1.5;
  font-size:14px;
  color:#8b7d87
}

.menu-overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-start;
  justify-content:flex-end;
  padding:72px 16px 20px;
  background:rgba(50,38,48,.22);
  backdrop-filter:blur(7px);
  z-index:20
}

.menu-overlay.open{
  display:flex
}

.menu-panel{
  width:min(370px,100%);
  padding:20px;
  border-radius:27px;
  background:rgba(255,255,255,.97);
  box-shadow:0 25px 70px rgba(40,30,40,.20);
  animation:panelIn .2s ease
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:translateY(-8px) scale(.98)
  }

  to{
    opacity:1;
    transform:none
  }
}

.menu-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px
}

.menu-header h2{
  margin:0;
  font-size:20px
}

.close-menu{
  width:38px;
  height:38px;
  border:0;
  border-radius:13px;
  background:#f7f0f4;
  color:#625761;
  font-size:21px
}

.language-option{
  width:100%;
  border:1px solid transparent;
  background:#faf5f8;
  border-radius:17px;
  padding:15px;
  margin-top:9px;
  text-align:left;
  color:#554a53;
  cursor:pointer;
  transition:.18s
}

.language-option.active{
  background:#f2dbe7;
  border-color:#ebc9da;
  font-weight:700
}

.practice-screen{
  display:none
}

.practice-screen.active{
  display:block
}

.home-screen.hidden{
  display:none
}

.practice-top{
  display:flex;
  align-items:center;
  margin-bottom:18px
}

.back-button{
  width:46px;
  height:46px;
  border-radius:16px;
  font-size:23px;
  flex:none
}

.practice-title{
  text-align:center;
  flex:1;
  margin:0 10px
}

.practice-title h2{
  margin:0;
  font-size:21px;
  color:#443a44
}

.practice-title p{
  margin:4px 0 0;
  color:#8a7d87;
  font-size:13px
}

.progress-area{
  margin-bottom:16px
}

.progress-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#7d7079;
  font-size:13px;
  margin-bottom:7px
}

.progress-bar{
  height:9px;
  background:#f0e5eb;
  border-radius:30px;
  overflow:hidden
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#d99abb,#c994e2);
  border-radius:30px;
  transition:width .28s
}

.match-toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px
}

.round-info{
  flex:1;
  text-align:center;
  color:#81747e;
  font-size:13px
}

.errors-info{
  padding:8px 11px;
  border-radius:13px;
  background:rgba(250,244,247,.9);
  color:#8b7d87;
  font-size:13px
}

.columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  margin-bottom:16px
}

.match-column{
  display:grid;
  gap:10px;
  align-content:start
}

.word-tile{
  position:relative;
  width:100%;
  min-height:68px;
  border:1px solid rgba(239,215,228,.85);
  border-radius:20px;
  padding:12px 9px;
  background:linear-gradient(145deg,#fffdfd,#fff5f9);
  color:#443a44;
  box-shadow:0 8px 23px rgba(82,55,73,.075);
  cursor:pointer;
  transition:
    transform .18s,
    box-shadow .18s,
    border-color .18s,
    background .18s,
    opacity .18s
}

.match-column:first-child .word-tile{
  background:linear-gradient(145deg,#fffdfd,#fff1f6)
}

.match-column:last-child .word-tile{
  background:linear-gradient(145deg,#fffdfd,#f5efff)
}

.word-tile:active{
  transform:scale(.975)
}

.word-tile.selected{
  border:2px solid #7db78d;
  background:#f5fff7;
  box-shadow:
    0 0 0 3px rgba(125,183,141,.12),
    0 10px 25px rgba(90,150,105,.10);
  transform:translateY(-1px)
}

.word-tile.wrong{
  border:2px solid #dc8c91;
  background:#fff5f5;
  animation:wrong .30s ease
}

.word-tile.correct{
  border:2px solid #9dceaa;
  background:#effaf1;
  animation:correct .42s cubic-bezier(.2,.8,.2,1) forwards;
  pointer-events:none
}

.word-tile.hidden{
  visibility:hidden;
  pointer-events:none
}

.tile-main{
  display:block;
  font-size:15.5px;
  font-weight:650;
  line-height:1.28;
  word-break:break-word
}

@keyframes wrong{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-5px)
  }

  50%{
    transform:translateX(5px)
  }

  75%{
    transform:translateX(-3px)
  }
}

@keyframes correct{
  0%{
    opacity:1;
    transform:scale(1)
  }

  35%{
    opacity:1;
    transform:scale(1.035)
  }

  100%{
    opacity:0;
    transform:scale(.72) translateY(-4px)
  }
}

.stopwatch{
  text-align:center;
  margin-bottom:11px;
  color:#7d7079;
  font-size:13px
}

.stopwatch strong{
  font-size:18px;
  color:#403741
}

.timer-box{
  text-align:center;
  margin-bottom:14px
}

.timer-value{
  font-size:30px;
  font-weight:750;
  color:#403741
}

.timer-select{
  margin-top:9px;
  border:1px solid #eadde5;
  background:#fff;
  border-radius:15px;
  padding:12px;
  width:100%;
  color:#594d57
}

.timer-start{
  width:100%;
  margin-top:9px;
  border:0;
  border-radius:16px;
  padding:13px;
  background:#f2dbe7;
  color:#594d57;
  font-weight:700;
  cursor:pointer
}

.timer-start:disabled{
  opacity:.62
}

.finish-box{
  display:none;
  text-align:center;
  background:rgba(255,255,255,.93);
  border:1px solid #f0dfe8;
  border-radius:27px;
  padding:30px 20px;
  box-shadow:0 13px 40px rgba(80,55,70,.09);
  animation:finishIn .28s ease
}

.finish-box.active{
  display:block
}

@keyframes finishIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98)
  }

  to{
    opacity:1;
    transform:none
  }
}

.finish-box .big{
  font-size:48px;
  margin-bottom:10px
}

.finish-box h2{
  margin:0 0 8px
}

.finish-box p{
  color:#81747d;
  line-height:1.5
}

.restart-button{
  border:0;
  border-radius:16px;
  background:#403741;
  color:#fff;
  padding:14px 22px;
  cursor:pointer;
  font-weight:700;
  margin-top:10px
}

@media(min-width:600px){
  .app{
    padding-top:34px
  }

  .modes{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:420px){
  .columns{
    gap:8px
  }

  .word-tile{
    min-height:62px;
    padding:10px 6px
  }

  .tile-main{
    font-size:14px
  }

  .flag.uk{
    font-size:145px
  }

  .flag.kr{
    font-size:140px
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    transition-duration:.01ms!important
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="decoration one"></div>
  <div class="decoration two"></div>

  <div class="flag uk" aria-hidden="true">🇬🇧</div>
  <div class="flag kr" aria-hidden="true">🇰🇷</div>

  <div class="content">

    <div class="home-screen" id="homeScreen">

      <header class="topbar">

        <button
          class="menu-button"
          id="menuButton"
          aria-label="Меню">
          ☰
        </button>

      </header>

      <main>

        <section class="hero">

          <div class="flower">
            🌸
          </div>

          <h1>
            Language Practice
          </h1>

          <p>
            Уютное место для практики
            английского и корейского языка.
          </p>

        </section>

        <section>

          <div class="section-title">
            Выбери режим практики
          </div>

          <div class="modes">

            <button
              class="mode-card"
              id="normalMode">

              <div class="mode-icon">
                🌿
              </div>

              <h2>
                Обычная практика
              </h2>

              <p>
                Проходи слова спокойно.
                Секундомер покажет, сколько времени
                заняла тренировка.
              </p>

            </button>

            <button
              class="mode-card"
              id="timerMode">

              <div class="mode-icon">
                ⏱️
              </div>

              <h2>
                Практика с таймером
              </h2>

              <p>
                Выбери время и попробуй пройти
                как можно больше слов до окончания таймера.
              </p>

            </button>

          </div>

        </section>

      </main>

    </div>


    <div
      class="practice-screen"
      id="practiceScreen">

      <div class="practice-top">

        <button
          class="back-button"
          id="backButton"
          aria-label="Назад">
          ←
        </button>

        <div class="practice-title">

          <h2 id="practiceHeading">
            Обычная практика
          </h2>

          <p id="pairHeading">
            Английский — Русский
          </p>

        </div>

        <div style="width:46px"></div>

      </div>


      <div
        class="timer-box"
        id="timerBox">

        <div
          class="timer-value"
          id="timerValue">
          05:00
        </div>

        <select
          class="timer-select"
          id="timerSelect">

          <option
            value="300"
            selected>
            5 минут
          </option>

          <option value="360">
            6 минут
          </option>

          <option value="420">
            7 минут
          </option>

          <option value="480">
            8 минут
          </option>

          <option value="540">
            9 минут
          </option>

          <option value="600">
            10 минут
          </option>

          <option value="660">
            11 минут
          </option>

          <option value="720">
            12 минут
          </option>

          <option value="780">
            13 минут
          </option>

          <option value="840">
            14 минут
          </option>

          <option value="900">
            15 минут
          </option>

          <option value="960">
            16 минут
          </option>

          <option value="1020">
            17 минут
          </option>

          <option value="1080">
            18 минут
          </option>

          <option value="1140">
            19 минут
          </option>

          <option value="1200">
            20 минут
          </option>

        </select>

        <button
          class="timer-start"
          id="timerStart">
          Начать
        </button>

      </div>


      <div
        class="stopwatch"
        id="stopwatch">

        Время:
        <strong>00:00</strong>

      </div>


      <div class="progress-area">

        <div class="progress-info">

          <span id="progressText">
            Слово 0 из 0
          </span>

          <span id="scoreText">
            Знаю: 0
          </span>

        </div>

        <div class="progress-bar">

          <div
            class="progress-fill"
            id="progressFill">
          </div>

        </div>

      </div>


      <div class="match-toolbar">

        <div
          class="round-info"
          id="roundInfo">
          Раунд 1
        </div>

        <div
          class="errors-info"
          id="errorsInfo">
          Ошибки: 0
        </div>

      </div>


      <div
        class="columns"
        id="columns">

        <div
          class="match-column"
          id="leftColumn">
        </div>

        <div
          class="match-column"
          id="rightColumn">
        </div>

      </div>


      <div
        class="finish-box"
        id="finishBox">

        <div class="big">
          🌸
        </div>

        <h2 id="finishTitle">
          Раунд завершён
        </h2>

        <p id="finishText">
        </p>

        <button
          class="restart-button"
          id="restartButton">
          Ещё раз
        </button>

      </div>

    </div>

  </div>

</div>


<div
  class="menu-overlay"
  id="menuOverlay">

  <div class="menu-panel">

    <div class="menu-header">

      <h2>
        Выбор языка
      </h2>

      <button
        class="close-menu"
        id="closeMenu"
        aria-label="Закрыть">
        ×
      </button>

    </div>

    <button
      class="language-option active"
      data-language="en-ru">
      🇬🇧 Английский — Русский
    </button>

    <button
      class="language-option"
      data-language="ko-ru">
      🇰🇷 Корейский — Русский
    </button>

    <button
      class="language-option"
      data-language="ko-en">
      🇰🇷 Корейский — Английский
    </button>

  </div>

</div>


<script>

const $ =
  id => document.getElementById(id);


const homeScreen =
  $("homeScreen");

const practiceScreen =
  $("practiceScreen");

const menuOverlay =
  $("menuOverlay");

const leftColumn =
  $("leftColumn");

const rightColumn =
  $("rightColumn");

const progressText =
  $("progressText");

const progressFill =
  $("progressFill");

const scoreText =
  $("scoreText");

const errorsInfo =
  $("errorsInfo");

const roundInfo =
  $("roundInfo");

const finishBox =
  $("finishBox");

const finishTitle =
  $("finishTitle");

const finishText =
  $("finishText");

const timerBox =
  $("timerBox");

const timerValue =
  $("timerValue");

const timerSelect =
  $("timerSelect");

const timerStart =
  $("timerStart");

const stopwatch =
  $("stopwatch");

const practiceHeading =
  $("practiceHeading");

const pairHeading =
  $("pairHeading");


let allWords = [];

let language = "en-ru";

let mode = "normal";

let roundWords = [];

let remainingWords = [];

let selectedTile = null;

let knownCount = 0;

let totalKnownCount = 0;

let errors = 0;

let roundNumber = 0;

let stopwatchSeconds = 0;

let stopwatchId = null;

let timerSeconds = 300;

let timerId = null;

let running = false;

let lockedUntil = 0;


const languageSettings = {

  "en-ru": {
    name: "Английский — Русский",
    leftKey: "english",
    rightKey: "russian"
  },

  "ko-ru": {
    name: "Корейский — Русский",
    leftKey: "korean",
    rightKey: "russian"
  },

  "ko-en": {
    name: "Корейский — Английский",
    leftKey: "korean",
    rightKey: "english"
  }

};


function normalizeWords(data) {

  const words =
    Array.isArray(data)
      ? data
      : (
        data &&
        Array.isArray(data.words)
          ? data.words
          : []
      );

  return words.filter(
    word =>
      word &&
      word.russian &&
      word.english &&
      word.korean
  );

}


async function loadWords() {

  try {

    const response =
      await fetch(
        "data/words.json",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Не удалось загрузить words.json"
      );

    }

    allWords =
      normalizeWords(
        await response.json()
      );

    if (!allWords.length) {

      throw new Error(
        "В words.json нет слов с english, korean и russian"
      );

    }

  } catch (error) {

    console.error(error);

    allWords = [];

    alert(
      "Не удалось загрузить слова.\n\nПроверь файл data/words.json."
    );

  }

}


function shuffle(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


function getWordText(
  word,
  side
) {

  const settings =
    languageSettings[language];

  return word[
    side === "left"
      ? settings.leftKey
      : settings.rightKey
  ];

}


function updateLanguageUI() {

  pairHeading.textContent =
    languageSettings[language].name;

  document
    .querySelectorAll(
      ".language-option"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.language === language
        );

      }
    );

}


function formatTime(seconds) {

  const minutes =
    Math.floor(
      Math.max(
        0,
        seconds
      ) / 60
    )
    .toString()
    .padStart(2, "0");

  const secs =
    (
      Math.max(
        0,
        seconds
      ) % 60
    )
    .toString()
    .padStart(2, "0");

  return `${minutes}:${secs}`;

}


function updateTimerSelect() {

  timerSeconds =
    Number(
      timerSelect.value
    );

  timerValue.textContent =
    formatTime(
      timerSeconds
    );

}


function resetClocks() {

  clearInterval(
    stopwatchId
  );

  clearInterval(
    timerId
  );

  stopwatchId = null;

  timerId = null;

  stopwatchSeconds = 0;

  stopwatch.innerHTML =
    'Время: <strong>00:00</strong>';

  timerSeconds =
    Number(
      timerSelect.value
    );

  timerValue.textContent =
    formatTime(
      timerSeconds
    );

}


function startStopwatch() {

  clearInterval(
    stopwatchId
  );

  stopwatchId =
    setInterval(
      () => {

        if (!running) {
          return;
        }

        stopwatchSeconds++;

        stopwatch.innerHTML =
          `Время: <strong>${
            formatTime(
              stopwatchSeconds
            )
          }</strong>`;

      },
      1000
    );

}


function startTimer() {

  clearInterval(
    timerId
  );

  timerSeconds =
    Number(
      timerSelect.value
    );

  timerValue.textContent =
    formatTime(
      timerSeconds
    );

  timerId =
    setInterval(
      () => {

        if (!running) {
          return;
        }

        timerSeconds--;

        timerValue.textContent =
          formatTime(
            timerSeconds
          );

        if (
          timerSeconds <= 0
        ) {

          clearInterval(
            timerId
          );

          timerId = null;

          running = false;

          finishGame(true);

        }

      },
      1000
    );

}


function openPractice(
  selectedMode
) {

  if (!allWords.length) {
    return;
  }

  mode =
    selectedMode;

  remainingWords =
    shuffle(
      allWords
    );

  roundWords = [];

  selectedTile = null;

  knownCount = 0;

  totalKnownCount = 0;

  errors = 0;

  roundNumber = 0;

  errorsInfo.textContent =
    "Ошибки: 0";

  homeScreen.classList.add(
    "hidden"
  );

  practiceScreen.classList.add(
    "active"
  );

  practiceHeading.textContent =
    mode === "normal"
      ? "Обычная практика"
      : "Практика с таймером";

  updateLanguageUI();

  timerBox.style.display =
    mode === "timer"
      ? "block"
      : "none";

  stopwatch.style.display =
    mode === "normal"
      ? "block"
      : "none";

  finishBox.classList.remove(
    "active"
  );

  resetClocks();

  if (
    mode === "normal"
  ) {

    running = true;

    startStopwatch();

    startRound();

  } else {

    running = false;

    timerStart.disabled =
      false;

    timerStart.textContent =
      "Начать";

  }

}


function startRound() {

  if (
    !remainingWords.length
  ) {

    finishGame(false);

    return;

  }

  roundNumber++;

  roundWords =
    remainingWords.splice(
      0,
      Math.min(
        8,
        remainingWords.length
      )
    );

  knownCount = 0;

  renderRound();

}


function renderRound() {

  selectedTile = null;

  lockedUntil = 0;

  leftColumn.innerHTML = "";

  rightColumn.innerHTML = "";

  finishBox.classList.remove(
    "active"
  );

  roundInfo.textContent =
    `Раунд ${roundNumber}`;

  shuffle(
    roundWords
  )
    .forEach(
      word =>
        leftColumn.appendChild(
          createTile(
            word,
            "left"
          )
        )
    );

  shuffle(
    roundWords
  )
    .forEach(
      word =>
        rightColumn.appendChild(
          createTile(
            word,
            "right"
          )
        )
    );

  updateProgress();

}


function createTile(
  word,
  side
) {

  const tile =
    document.createElement(
      "button"
    );

  tile.className =
    "word-tile";

  tile.dataset.side =
    side;

  tile.innerHTML =
    `<span class="tile-main">${
      escapeHtml(
        getWordText(
          word,
          side
        )
      )
    }</span>`;

  tile.addEventListener(
    "click",
    () =>
      selectTile(
        tile,
        word
      )
  );

  return tile;

}


function escapeHtml(
  value
) {

  return String(
    value
  ).replace(
    /[&<>"']/g,
    character =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[character])
  );

}


function selectTile(
  tile,
  word
) {

  if (
    !running ||
    Date.now() < lockedUntil ||
    tile.classList.contains("correct") ||
    tile.classList.contains("wrong") ||
    tile.classList.contains("hidden")
  ) {

    return;

  }

  const side =
    tile.dataset.side;


  /*
    ПОВТОРНОЕ НАЖАТИЕ
    НА ТО ЖЕ САМОЕ СЛОВО
    ОТМЕНЯЕТ ВЫБОР
  */

  if (
    selectedTile &&
    selectedTile.tile === tile
  ) {

    tile.classList.remove(
      "selected"
    );

    selectedTile = null;

    return;

  }


  /*
    ЕСЛИ НАЖАТО ДРУГОЕ
    СЛОВО В ТОМ ЖЕ СТОЛБЦЕ —
    ПРОСТО МЕНЯЕМ ВЫБОР.
    ОШИБКОЙ ЭТО НЕ СЧИТАЕТСЯ.
  */

  if (
    selectedTile &&
    selectedTile.tile.dataset.side === side
  ) {

    selectedTile.tile.classList.remove(
      "selected"
    );

    tile.classList.add(
      "selected"
    );

    selectedTile = {
      tile,
      word
    };

    return;

  }


  /*
    ЕСЛИ ПЕРВОГО ВЫБОРА ЕЩЁ НЕТ
  */

  if (!selectedTile) {

    tile.classList.add(
      "selected"
    );

    selectedTile = {
      tile,
      word
    };

    return;

  }


  /*
    ЗДЕСЬ УЖЕ ВЫБРАНЫ
    СЛОВА ИЗ РАЗНЫХ СТОЛБЦОВ
  */

  const first =
    selectedTile;

  tile.classList.add(
    "selected"
  );


  /*
    Слова одного объекта
    в нашем массиве являются
    правильной парой.
  */

  if (
    first.word === word
  ) {

    handleCorrect(
      first.tile,
      tile
    );

  } else {

    handleWrong(
      first.tile,
      tile
    );

  }

}


function playSuccessSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const ctx =
      new AudioContext();

    const now =
      ctx.currentTime;

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.setValueAtTime(
      660,
      now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      990,
      now + 0.12
    );

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.055,
      now + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.18
    );

    oscillator.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );

    oscillator.start(
      now
    );

    oscillator.stop(
      now + 0.19
    );

    setTimeout(
      () =>
        ctx.close().catch(
          () => {}
        ),
      300
    );

  } catch (error) {

    console.debug(
      "Звук недоступен",
      error
    );

  }

}


function handleCorrect(
  firstTile,
  secondTile
) {

  firstTile.classList.remove(
    "selected"
  );

  secondTile.classList.remove(
    "selected"
  );

  firstTile.classList.add(
    "correct"
  );

  secondTile.classList.add(
    "correct"
  );

  knownCount++;

  totalKnownCount++;

  selectedTile = null;

  lockedUntil =
    Date.now() + 430;

  playSuccessSound();


  setTimeout(
    () => {

      firstTile.classList.add(
        "hidden"
      );

      secondTile.classList.add(
        "hidden"
      );

      updateProgress();

      if (
        knownCount ===
        roundWords.length
      ) {

        setTimeout(
          completeRound,
          180
        );

      }

    },
    430
  );

}


function handleWrong(
  firstTile,
  secondTile
) {

  errors++;

  errorsInfo.textContent =
    `Ошибки: ${errors}`;

  firstTile.classList.remove(
    "selected"
  );

  secondTile.classList.remove(
    "selected"
  );

  firstTile.classList.add(
    "wrong"
  );

  secondTile.classList.add(
    "wrong"
  );

  selectedTile = null;

  lockedUntil =
    Date.now() + 330;


  setTimeout(
    () => {

      firstTile.classList.remove(
        "wrong"
      );

      secondTile.classList.remove(
        "wrong"
      );

      lockedUntil = 0;

    },
    330
  );

}


function updateProgress() {

  const total =
    allWords.length;

  const completedBeforeRound =
    total -
    remainingWords.length -
    roundWords.length;

  const done =
    completedBeforeRound +
    knownCount;

  progressText.textContent =
    `Слово ${
      Math.min(
        done,
        total
      )
    } из ${total}`;

  progressFill.style.width =
    total
      ? `${
          Math.min(
            100,
            (done / total) * 100
          )
        }%`
      : "0%";

  scoreText.textContent =
    `Знаю: ${totalKnownCount}`;

}


function completeRound() {

  if (!running) {
    return;
  }

  if (
    remainingWords.length > 0
  ) {

    startRound();

  } else {

    finishGame(false);

  }

}


function finishGame(
  timeUp
) {

  running = false;

  clearInterval(
    stopwatchId
  );

  clearInterval(
    timerId
  );

  stopwatchId = null;

  timerId = null;

  finishBox.classList.add(
    "active"
  );

  finishTitle.textContent =
    timeUp
      ? "Время вышло"
      : "Всё пройдено!";

  finishText.textContent =
    timeUp
      ? `Ты успел пройти ${
          totalKnownCount
        } пар. Ошибок: ${
          errors
        }.`
      : `Все ${
          allWords.length
        } слов пройдены. Ошибок: ${
          errors
        }.`;

  leftColumn.innerHTML =
    "";

  rightColumn.innerHTML =
    "";

}


function restartPractice() {

  remainingWords =
    shuffle(
      allWords
    );

  roundWords = [];

  selectedTile = null;

  knownCount = 0;

  totalKnownCount = 0;

  errors = 0;

  roundNumber = 0;

  errorsInfo.textContent =
    "Ошибки: 0";

  finishBox.classList.remove(
    "active"
  );

  resetClocks();


  if (
    mode === "timer"
  ) {

    running = false;

    timerStart.disabled =
      false;

    timerStart.textContent =
      "Начать";

  } else {

    running = true;

    startStopwatch();

    startRound();

  }

}


function goHome() {

  running = false;

  clearInterval(
    stopwatchId
  );

  clearInterval(
    timerId
  );

  stopwatchId = null;

  timerId = null;

  selectedTile = null;

  lockedUntil = 0;

  practiceScreen.classList.remove(
    "active"
  );

  homeScreen.classList.remove(
    "hidden"
  );

  finishBox.classList.remove(
    "active"
  );

  leftColumn.innerHTML =
    "";

  rightColumn.innerHTML =
    "";

}


/* МЕНЮ */

$("menuButton")
  .addEventListener(
    "click",
    () =>
      menuOverlay.classList.add(
        "open"
      )
  );


$("closeMenu")
  .addEventListener(
    "click",
    () =>
      menuOverlay.classList.remove(
        "open"
      )
  );


menuOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      menuOverlay
    ) {

      menuOverlay.classList.remove(
        "open"
      );

    }

  }
);


document
  .querySelectorAll(
    ".language-option"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          language =
            button.dataset.language;

          updateLanguageUI();

          menuOverlay.classList.remove(
            "open"
          );


          /*
            Если язык меняется прямо
            во время практики —
            начинаем новую практику
            с новым направлением.
          */

          if (
            practiceScreen.classList.contains(
              "active"
            )
          ) {

            restartPractice();

          }

        }
      );

    }
  );


/* РЕЖИМЫ */

$("normalMode")
  .addEventListener(
    "click",
    () =>
      openPractice(
        "normal"
      )
  );


$("timerMode")
  .addEventListener(
    "click",
    () =>
      openPractice(
        "timer"
      )
  );


$("backButton")
  .addEventListener(
    "click",
    goHome
  );


$("restartButton")
  .addEventListener(
    "click",
    restartPractice
  );


/* ТАЙМЕР */

timerSelect.addEventListener(
  "change",
  updateTimerSelect
);


timerStart.addEventListener(
  "click",
  () => {

    if (
      mode !== "timer" ||
      !allWords.length
    ) {

      return;

    }


    if (
      !roundWords.length
    ) {

      remainingWords =
        shuffle(
          allWords
        );

      knownCount = 0;

      totalKnownCount = 0;

      errors = 0;

      roundNumber = 0;

      errorsInfo.textContent =
        "Ошибки: 0";

      startRound();

    }


    running = true;

    timerStart.disabled =
      true;

    timerStart.textContent =
      "Идёт практика";

    startTimer();

  }
);


/* СТАРТ */

updateLanguageUI();

updateTimerSelect();

loadWords();

</script>

</body>
</html>
